# 재화 칩: CoreUi 메뉴와 같은 가죽 테두리 + 양피지 바탕, 아이콘 포함. 9px 미니 아이콘(art/icons/*_mini.png) 기준 높이 13px, 실버 77x13(999,999.99까지), 골드·코코넛 51x13(9,999까지).
# 원본 아이콘은 art/icons/*_mini.png, 생성: java tools/HudChips.java art/icons common-resources/default/assets/currency
currency_silver:
  type: single
  file: currency/chip_silver.png

currency_gold:
  type: single
  file: currency/chip_gold.png

currency_kokonut:
  type: single
  file: currency/chip_kokonut.png

# 위치 배너: 재화 칩과 같은 가죽 테두리·양피지 바탕의 리본. 한 줄 176x18(영역 이름·바이옴), 두 줄 176x29(바이옴 + 구조물).
# 생성: java tools/HudLocationBanner.java common-resources/default/assets/location
location_banner:
  type: single
  file: location/banner.png

location_banner_tall:
  type: single
  file: location/banner_tall.png
