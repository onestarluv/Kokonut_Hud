# 실버 · 골드 · 코코넛 칩을 화면 왼쪽 위에 한 줄로 표시합니다.
# 칩은 원본 크기(scale 1.0)로 그려 픽셀이 고르게 보입니다. 9px 미니 아이콘에 맞춰 높이 13px, 실버 77x13(999,999.99까지),
# 골드·코코넛 51x13(9,999까지). 칩 사이 여백 4px: 실버 0, 골드 81, 코코넛 136.
# 숫자는 아이콘 칸 뒤 x+15부터 그립니다. 7px 숫자와 쉼표 꼬리는 칩의 y=3..10에 들어갑니다.
# 글자색은 CoreUi 메뉴 본문과 같은 #3B2A1A, 그림자 없음.
currency_bar:
  offset: left # 화면 왼쪽 위의 기존 기준점을 유지합니다.
  images:
    1:
      name: currency_silver
      x: 0
      y: 0
      scale: 1.0
    2:
      name: currency_gold
      x: 81
      y: 0
      scale: 1.0
    3:
      name: currency_kokonut
      x: 136
      y: 0
      scale: 1.0
  texts:
    1:
      name: currency_font
      pattern: "[currency_silver]"
      placeholder-string-format:
        number: "#,##0.##"
      x: 15
      y: 3
      scale: 1.0
      color: "#3B2A1A"
      outline: false
      align: left
    2:
      name: currency_font
      pattern: "[currency_gold]"
      placeholder-string-format:
        number: "#,###"
      x: 96
      y: 3
      scale: 1.0
      color: "#3B2A1A"
      outline: false
      align: left
    3:
      name: currency_font
      pattern: "[currency_kokonut]"
      placeholder-string-format:
        number: "#,###"
      x: 151
      y: 3
      scale: 1.0
      color: "#3B2A1A"
      outline: false
      align: left
# 위치 배너: 화면 위쪽 가운데. Kokonut_Guard 영역의 kokonut-hud 플래그 값, 또는 wild* 월드의 바이옴·구조물을 4초 동안 표시합니다.
# [location_lines]가 1이면 한 줄 배너, 2면 두 줄 배너. 글자는 그룹 align: center로 배너 폭 안에서 가운데 정렬됩니다.
location_banner:
  offset: center
  align: center
  conditions:
    1:
      first: location_lines
      second: "1"
      operation: "=="
  images:
    1:
      name: location_banner
      x: 0
      y: 0
      scale: 1.0
  texts:
    1:
      name: location_font
      pattern: "[location_title]"
      x: 0
      y: 2
      scale: 1.4
      color: "#3B2A1A"
      outline: false
location_banner_tall:
  offset: center
  align: center
  conditions:
    1:
      first: location_lines
      second: "2"
      operation: "=="
  images:
    1:
      name: location_banner_tall
      x: 0
      y: 0
      scale: 1.0
  texts:
    1:
      name: location_font
      pattern: "[location_title]"
      x: 0
      y: 2
      scale: 1.4
      color: "#3B2A1A"
      outline: false
    2:
      name: location_font
      pattern: "[location_subtitle]"
      x: 0
      y: 16
      scale: 1.4
      color: "#7A4E2D"
      outline: false
